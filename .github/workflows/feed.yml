name: Feed

# Regenerates blog/feed.xml, sitemap.xml and sitemap-news.xml from the published HTML and commits
# them back to main when they changed. PR CI (sitemap.yml) already fails a PR whose feed or sitemap
# is stale, so on a normal merge this job is a no-op; it is the safety net for direct pushes and
# the daily rebuild that ages articles out of the 48-hour Google News sitemap.
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "index.html"
      - "scripts/gen-feed.py"
      - "scripts/gen-sitemap.py"
      - "scripts/gen-news-sitemap.py"
  schedule:
    - cron: "7 10 * * *"   # 10:07 UTC daily (06:07 EDT / 05:07 EST); off the :00 mark, which GitHub delays most
  workflow_dispatch:

permissions:
  contents: write   # push the regenerated files
  pages: write      # only for the "request a Pages build" fallback step

concurrency:
  group: feed-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    # Loop guard #1: never react to our own commit. (#2: GITHUB_TOKEN pushes do not start push
    # workflows at all. #3: the commit message carries [skip ci].)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate feed and sitemaps
        run: |
          python3 scripts/gen-feed.py
          python3 scripts/gen-sitemap.py
          python3 scripts/gen-news-sitemap.py
      - name: Validate
        run: |
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          xmllint --noout blog/feed.xml sitemap.xml sitemap-news.xml
          [ ! -f blog/atom.xml ] || xmllint --noout blog/atom.xml
          python3 scripts/gen-feed.py --check
          python3 scripts/gen-sitemap.py --check
      - name: Commit if changed
        id: commit
        run: |
          files="blog/feed.xml sitemap.xml sitemap-news.xml"
          [ -f blog/atom.xml ] && files="$files blog/atom.xml"
          git add $files
          if git diff --cached --quiet; then
            echo "Nothing changed."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(feed): regenerate feed and sitemaps [skip ci]" \
                     -m "Automated by .github/workflows/feed.yml (${{ github.event_name }})."
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && break
            sleep 5
          done
          echo "pushed=true"  >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Make sure GitHub Pages deploys the bot commit
        # Branch-based Pages ("pages build and deployment") should build on the push above. If it did
        # not pick up the bot commit within ~90 s, request a build (legacy build API; harmless if redundant).
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          sleep 90
          latest=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .commit || echo none)
          if [ "$latest" != "$SHA" ]; then
            echo "Pages has not built $SHA (latest: $latest); requesting a build"
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Pages build request failed; check Settings > Pages"
          else
            echo "Pages built $SHA"
          fi
