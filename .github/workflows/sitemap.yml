name: Sitemap

# Fails any PR (and any push to main) whose sitemap.xml does not match the
# published HTML, so every Pages deploy ships a fresh sitemap.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sitemap-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sitemap.xml is up to date
        run: python3 scripts/gen-sitemap.py --check
      - name: Check blog/feed.xml (RSS) is up to date and every post date carries a timezone
        run: python3 scripts/gen-feed.py --check --strict
      - name: Check the blog search index is up to date
        run: python3 scripts/build-search-index.py --check
      - name: Check the author page and post author markup are up to date
        run: |
          python3 scripts/build-author-page.py --check
          python3 scripts/refresh-author-markup.py --check
      - name: Validate sitemap XML and robots.txt reference
        run: |
          python3 -c "import xml.dom.minidom as m; m.parse('sitemap.xml'); print('sitemap.xml well-formed')"
          grep -q '^Sitemap: https://www.octoprobe.ai/sitemap.xml' robots.txt
          python3 -c "import xml.dom.minidom as m; m.parse('blog/feed.xml'); print('blog/feed.xml well-formed')"
          python3 -c "import xml.dom.minidom as m; m.parse('sitemap-news.xml'); print('sitemap-news.xml well-formed')"
      - name: Every served page carries exactly one Google Analytics tag
        run: |
          fail=0
          for f in $(git ls-files '*.html'); do
            js=$(grep -c 'googletagmanager.com/gtag/js?id=G-6T6HW79ZP0' "$f")
            cfg=$(grep -c "gtag('config', 'G-6T6HW79ZP0')" "$f")
            [ "$js" = 1 ] && [ "$cfg" = 1 ] || { echo "GA tag missing or duplicated in $f (js=$js config=$cfg)"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "GA tag present once on every page"
          exit $fail
      - name: Every blog post is listed
        run: |
          for d in blog/*/index.html; do
            case "$d" in blog/_*) continue;; esac
            grep -q 'http-equiv="refresh"' "$d" && continue  # redirect stub
            slug=$(basename "$(dirname "$d")")
            grep -q "/blog/$slug/</loc>" sitemap.xml || { echo "missing $slug"; exit 1; }
          done
          echo "all posts listed"
      - name: Every author page is listed
        run: |
          for d in blog/authors/*/index.html; do
            [ -e "$d" ] || continue
            name=$(basename "$(dirname "$d")")
            grep -q "/blog/authors/$name/</loc>" sitemap.xml || { echo "missing author $name"; exit 1; }
          done
          echo "all author pages listed"
